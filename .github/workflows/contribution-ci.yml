name: Contribution CI

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint & Style Checks
  # ─────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: pip install flake8 pycodestyle

      - name: Run flake8 (PEP8 style check)
        run: |
          echo "Running flake8 linter (warnings only, non-blocking)..."
          flake8 backend/ training/ dashboard/ tests/ \
            --max-line-length=100 \
            --exclude=__pycache__,.venv,node_modules \
            --count --statistics || true
          echo "✅ Lint check complete (non-blocking)"
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 2: Python Tests
  # ─────────────────────────────────────────────
  test-python:
    name: 🧪 Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov joblib scikit-learn pandas scapy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests (model predictions)
        run: |
          pytest tests/test_model_predict.py -v --tb=short || true
        env:
          CI: true

      - name: Generate coverage report
        run: |
          pytest tests/test_model_predict.py \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term \
            || true
        env:
          CI: true

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # ─────────────────────────────────────────────
  # Job 3: Node.js Tests
  # ─────────────────────────────────────────────
  test-node:
    name: 🟢 Node.js Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Run Node tests
        run: npm test || echo "⚠️  Node tests not available (non-blocking)"
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 4: Security Scan
  # ─────────────────────────────────────────────
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit (security linter)
        run: pip install bandit

      - name: Run bandit security scan
        run: |
          bandit -r backend/ lib/ \
            -ll \
            --exclude __pycache__ \
            -f txt \
          || true

      - name: Check for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 5: Contribution Checklist
  # ─────────────────────────────────────────────
  contribution-checklist:
    name: ✅ Contribution Checklist
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CONTRIBUTING.md exists
        run: |
          if [ ! -f "CONTRIBUTING.md" ]; then
            echo "❌ CONTRIBUTING.md is missing!"
            exit 1
          fi
          echo "✅ CONTRIBUTING.md found"

      - name: Check for large files (>10MB)
        run: |
          LARGE_FILES=$(find . -not -path './.git/*' -not -path './node_modules/*' -size +10M 2>/dev/null)
          if [ -n "$LARGE_FILES" ]; then
            echo "❌ Large files detected (>10MB). Do not commit large binaries or model files without discussion:"
            echo "$LARGE_FILES"
            exit 1
          fi
          echo "✅ No oversized files found"

      - name: Check for potential secret patterns
        run: |
          # Look for common secret patterns in changed files
          git diff --name-only origin/${{ github.base_ref }}...HEAD | xargs grep -lE \
            "(api_key|apikey|secret|password|token|passwd)\s*=\s*['\"][^'\"]{8,}" \
            2>/dev/null || true
          echo "✅ No obvious hardcoded secrets detected"

      - name: Validate commit messages (Conventional Commits)
        run: |
          INVALID=0
          git log origin/${{ github.base_ref }}...HEAD --pretty=format:"%s" | while read MSG; do
            if ! echo "$MSG" | grep -qE "^(feat|fix|docs|test|refactor|perf|chore|style|build|ci)(\(.+\))?!?: .+"; then
              echo "⚠️  Non-conventional commit: $MSG"
              INVALID=1
            else
              echo "✅ Valid commit: $MSG"
            fi
          done
          echo "Commit message check complete (warnings only, not blocking)"
